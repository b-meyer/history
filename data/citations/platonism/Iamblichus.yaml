- key: sep-iamblichus
  locator: '§3'
  excerpt: 'Iamblichus’ system is best characterized as a refined version of Plotinus’'
  passage: 8e9e828ee42b7136
- key: sep-iamblichus
  locator: '§3.1'
  excerpt: 'Below the One is located the intelligible triad of Limit, the Unlimited, and the One-Being.'

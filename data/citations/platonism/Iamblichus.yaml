- key: sep-iamblichus
  locator: preamble
  excerpt: 'Iamblichus (ca. 242–ca. 325) was a Syrian Neoplatonist and disciple of Porphyry of Tyre, the editor of Plotinus’ works. One of the three major representatives of early Neoplatonism (the third one being Plotinus himself)'
  passage: b3d530a84b1bdaa9
- key: sep-iamblichus
  locator: '§1.1'
  excerpt: 'His birthplace is traditionally taken to be Chalcis ad Belum (modern Qinnasrin)'
  passage: 387324fbffbaa58f
- key: eunapius-lives-wright
  locator: p. 363
  excerpt: 'Then leaving Anatolius he attached himself to Porphyry'
  passage: 2e0c4dcf809f5b06

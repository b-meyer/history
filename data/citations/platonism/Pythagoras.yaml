- key: sep-pythagoras
  locator: '§1'
  excerpt: 'By the third century CE, when the first detailed accounts of Pythagoras that survive intact were written, Pythagoras had come to be regarded, in some circles, as the master philosopher, from whom all that was true in the Greek philosophical tradition derived. By the end of the first century BCE, a large collection of books had been forged in the name of Pythagoras and other early Pythagoreans'

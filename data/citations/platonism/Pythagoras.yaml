- key: sep-pythagoras
  locator: '§3'
  excerpt: 'Aristoxenus says that he left Samos at the age of forty, when the tyranny of Polycrates, who came to power ca. 535 BCE, became unbearable (Porphyry, VP 9). This chronology would suggest that he was born ca. 570 BCE. He then emigrated to the Greek city of Croton in southern Italy ca. 530 BCE; it is in Croton that he first seems to have attracted a large number of followers to his way of life. There are a variety of stories about his death, but the most reliable evidence (Aristoxenus and Dicaearchus) suggests that violence directed against Pythagoras and his followers in Croton ca. 510 BCE, perhaps because of the exclusive nature of the Pythagorean way of life, led him to flee to another Greek city in southern Italy, Metapontum, where he died around 490 BCE'
  passage: fa694313564aa52d
- key: diogenes-laertius-lives-hicks
  locator: 'DL 8.3'
  excerpt: 'After that he returned to Samos to find his country under the tyranny of Polycrates; so he sailed away to Croton in Italy, and there he laid down a constitution for the Italian Greeks'

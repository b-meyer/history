- key: sep-pythagoras
  locator: '§4.3'
  excerpt: 'The testimony of both Plato (R. 600a) and Isocrates (Busiris 28) shows that Pythagoras was above all famous for having left behind him a way of life, which still had adherents in the fourth century over 100 years after his death. It is plausible to assume that many features of this way of life were designed to insure the best possible future reincarnations, but it is important to remember that nothing in the early evidence connects the way of life to reincarnation in any specific fashion.'

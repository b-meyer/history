- key: sep-pythagoras
  locator: '§2.2'
  excerpt: 'The most detailed, extended and hence most influential accounts of Pythagoras’ life and thought date to the third century CE, some 800 years after he died. Diogenes Laertius (ca. 200–250 CE) and Porphyry (ca. 234–305 CE) each wrote a Life of Pythagoras, while Iamblichus (ca. 245–325 CE) wrote On the Pythagorean Life, which includes some biography but focuses more on the way of life established by Pythagoras for his followers.'
  passage: c3ee83a18de92d49

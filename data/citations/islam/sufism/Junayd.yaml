- key: eor-junayd
  locator: preamble
  excerpt: 'JUNAYD, AL- (d. ah 298/910 ce)'
  passage: ce32fb19e94c40e8
- key: eor-sufism
  locator: preamble
  excerpt: 'the path of intoxication (sukr ) in contrast with the path of sobriety (ṣaḥw ) associated with the famous Baghdad Ṣūfī Abū al-Qāsim al-Junayd (d. 910)'
  passage: b2d12e7ab720aff4
- key: hujwiri-kashf-al-mahjub-nicholson
  locator: §11.31
  excerpt: 'His mother was the sister of Sarí Saqaṭí, and Junayd was the disciple of Sarí.'
  passage: 34acd532f10a9216
- key: hujwiri-kashf-al-mahjub-nicholson
  locator: §14.3
  excerpt: 'Junayd and his followers prefer sobriety to intoxication.'
  passage: ee65b9ed4621c540
- key: hujwiri-kashf-al-mahjub-nicholson
  locator: preamble
  excerpt: 'He agrees with his spiritual director, al-Khuttalí, in adopting the theory of Junayd that “sobriety” in the mystical acceptation of the term is preferable to “intoxication”.'
  passage: 485d9dd516ac6eaf
- key: hujwiri-kashf-al-mahjub-nicholson
  locator: §14.4
  excerpt: 'who in his time was called the Peacock of the Divines'
  passage: 5d17641aae25fe78

        verdict: confirmed
        source: sep-neoplatonism
        note: §8 dates the pseudo-epigraphic writings of Dionysius the Areopagite to the early 6th century, which largely fits 485/528, but it names no individual work such as On the Divine Names.
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: confirmed
        note: §1 places Dionysius's authorship between 485 (Proclus's death) and 518-28 (Severus of Antioch's first citation), a range for the whole corpus that is inferred, not specific to DN.
    sources:

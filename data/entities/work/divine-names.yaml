  - id: divine-names.attributed-to.pseudo-dionysius
    predicate: attributed-to
    object: pseudo-dionysius
    confidence: A
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: changed
        source: pseudo-dionysius-works-parker
        note: "Graded A primary: The Chapter_1 heading and opening line present the Divine Names as a letter 'To my Fellow Presbyter, Timothy, Dionysius the Presbyter', so the work is attributed to Dionysius, though that passage does not say 'Areopagite' or 'Pseudo-'."
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: confirmed
        note: §3.2 says Dionysius devotes his second theological treatise, On the Divine Names, to a particular kind of divine name, and the article treats the corpus as Pseudo-Dionysius's.
      - on: 2026-11-24
        by: claude-opus-5-5
        verdict: confirmed
        note: §3.2 says Dionysius devotes his second theological treatise, On the Divine Names, to a particular kind of divine name, so it treats him as the author without qualification.
    sources:
      - key: sep-pseudo-dionysius-areopagite
        locator: §3.2
        stance: asserts
        excerpt: But Dionysius devotes his second theological treatise, entitled On the Divine Names only to a particular kind of divine name.
      - key: pseudo-dionysius-works-parker
        locator: Chapter_1
        stance: asserts
        excerpt: To my Fellow Presbyter, Timothy, Dionysius the Presbyter.

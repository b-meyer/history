  - id: theology-of-aristotle.translates.enneads
    predicate: translates
    object: enneads
    confidence: A
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: confirmed
        source: sep-arabic-islamic-greek
        note: The text says the circle of al-Kindi produced the translation and reworking of significant parts of Enneads IV-VI, known as the Theology of Aristotle, and calls it an adapted translation of Plotinus.
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: confirmed
        note: The Theology is the longest and most famous text preserving an Arabic version of Plotinus' Enneads, though the SEP stresses it paraphrases and interpolates, so it is an interpretation and not a plain translation.
    sources:
      - key: sep-theology-aristotle
        locator: §1
        stance: asserts
        excerpt: The so-called Theology of Aristotle is the longest, and most famous, text to preserve an Arabic version of the Enneads of Plotinus.
      - key: sep-arabic-islamic-greek
        locator: §3
        stance: asserts
        excerpt: the circle of al-Kindi produced the translation and reworking of significant parts of the Enneads IV–VI known as the Theology of Aristotle
  - id: theology-of-aristotle.attributed-to.aristotle
    predicate: attributed-to
    object: aristotle
    confidence: B

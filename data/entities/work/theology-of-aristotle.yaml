        locator: §2
        stance: asserts
        excerpt: the son of the ‘Abbasid caliph who reigned from 833–842 AD (218–227 AH), so this gives us a fairly reliable date for the production of the Theology
      - key: sep-theology-aristotle
        locator: preamble
        stance: asserts
        excerpt: In the ninth century, Plotinus was translated into Arabic.

  - id: theology-of-aristotle.composed
    predicate: composed
    when: 0833/0842
    confidence: B
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: confirmed
        note: The preface names Ahmad ibn al-Mu'tasim, son of the caliph who reigned 833-842, which gives a fairly reliable date for the Theology or at least for al-Kindi's correction of it, and perhaps for the whole Arabic Plotinus translation.
      - on: 2026-11-24
        by: claude-opus-5-5
        verdict: confirmed
        note: Because al-Kindi corrected the text for Ahmad, son of the caliph who reigned 833-842, the article calls this 'a fairly reliable date' for producing the Theology, 'or at least' for al-Kindi's correction, and places the translation in the ninth century.
    sources:

        note: "Graded A scholarly: The text says Rumi began the Mathnavi with the Song of the Reed around November 1256 at Husam al-Din's request, paused it from 1258 to 1262, and continued dictating it almost until his death on December 17, 1273."
    sources:
      - key: eor-rumi
        locator: preamble
        stance: asserts
        excerpt: A poem dated November 1256 reveals the moment when Ḥusām al-Dīn first assumed his new role.
      - key: eor-rumi
        locator: preamble
        stance: asserts
        excerpt: The dictation of the Mathnavī resumed in 1262, when Ḥusām al-Dīn was designated as Rūmī's spiritual successor (khalīfah ), and continued almost to the master's death on December 17, 1273.
      - key: rumi-mesnevi-redhouse
        locator: §3.82
        stance: asserts
        excerpt: Husām married again; and in that year, A.H. 662 (A.D. 1263), the second book was commenced.
      - key: rumi-mesnevi-redhouse
        locator: preamble
        stance: asserts
        excerpt: The second volume was commenced in A.D. 1263.

        note: "Graded B scholarly: Muin al-Din Chishti (d. 1236), the order's founder, moved to Ajmer after arriving in Delhi in 1193 and founded a khanaqah there, and Ajmer is later called the Chishti city; the date range is inferred from those two dates."
    sources:
      - key: eor-tariqah
        locator: preamble
        stance: asserts
        excerpt: He arrived in Delhi in 1193 and then moved to Ajmer, an important city in newly conquered Rajputana, where he founded a khānaqāh.

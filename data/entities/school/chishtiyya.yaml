  - id: chishtiyya.active-at.delhi
    predicate: active-at
    object: delhi
    when: 12XX/13XX
    confidence: A
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: changed
        source: eor-islam-south-asia
        note: "Graded A scholarly: Qutb ad-Din Bakhtiyar Kaki (d. 1235) 'spread Chishti influence to Delhi', and the Delhi shaykhs Nizam al-Din (1238-1325) and Chiragh-i Dihli (1276-1356) are named, so 12XX/13XX fits."
      - on: 2026-11-24
        by: claude-sonnet-5-5
        verdict: changed
        note: 'Graded A scholarly: The text says Muʿīn al-Dīn arrived in Delhi in 1193 and Niẓām al-Dīn Awliyāʾ (d. 1325) spread the order from his center in Delhi.'
    sources:
      - key: eor-tariqah
        locator: preamble
        stance: asserts
        excerpt: Niẓām al-Dīn Awliyāʾ (d. 1325) spent fifty years extending the Chishtīyah throughout India by dispatching hundreds of his own disciples from his center in Delhi.
      - key: eor-islam-south-asia
        locator: preamble
        stance: asserts
        excerpt: His successor, Quṭb ad-Dīn Bakhtiyār Kākī (d. 1235), spread Chishtī influence to Delhi.
  - id: chishtiyya.active-at.ajmer

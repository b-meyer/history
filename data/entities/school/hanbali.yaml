  - id: hanbali.active-at.baghdad
    predicate: active-at
    object: baghdad
    when: 08XX/12XX
    confidence: A
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-23
        by: claude-sonnet-5-5
        verdict: changed
        note: "Graded A scholarly: Abu Ya'la's students spread the madhhab 'beyond the confines of Baghdad', which implies a Hanbali base there; this fits the 11th century and the later Damascus-learning-from-Baghdad passage, though the passage does not give a date for Baghdad itself."
      - on: 2026-11-23
        by: claude-opus-5-5
        verdict: confirmed
        note: "The quoted sentence (Eleventh century section) only implies Baghdad was the madhhab's base in Abu Ya'la's time, but the article elsewhere has Ibn Hanbal dying at Baghdad in 855, dates the madhhabs' emergence to about the mid-ninth century (Laoust: 847-945, no precise date determinable), and follows Baghdad Hanbalis to the Mongol conquest of the mid-thirteenth century, so presence is certain while the ninth-century start is approximate."
      - on: 2026-11-23
        by: claude-opus-5-5
        verdict: changed
        note: "Graded A scholarly: Under 'Eleventh century', EoR says Abu Ya'la (d. 1066) led the Hanbali madhhab, madrasahs flourished in Baghdad in this period, and two of his students spread the madhhab beyond the confines of Baghdad, so the school was based in Baghdad."
    sources:
      - key: eor-hanabilah
        locator: preamble
        stance: asserts
        excerpt: students especially helped to spread the madhhab beyond the confines of Baghdad

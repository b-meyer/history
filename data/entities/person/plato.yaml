        by: claude-opus-5-5
        verdict: confirmed
        note: SEP §3.7 reports a very wide range of opinion, with many recent Plato scholars giving Pythagoreanism little weight, but concludes that Plato's and Aristotle's evidence show considerable Pythagorean influence on Plato's late theory of principles and the world soul; Rouse Ball p. 35 ('perhaps') and DL 3.8 also connect Plato with the Pythagoreans.
    sources:
      - key: sep-pythagoreanism
        locator: §3.7
        stance: asserts
        excerpt: Pythagoreanism exerted considerable influence on Plato’s late theory of principles
      - key: rouse-ball-short-account-history-mathematics
        locator: p. 35
        stance: reports
        excerpt: perhaps his philosophy should be regarded as founded on the Pythagorean rather than on the Socratic teaching
      - key: diogenes-laertius-lives-hicks
        locator: DL 3.8
        stance: reports
        excerpt: He mixed together doctrines of Heraclitus, the Pythagoreans and Socrates.

      - on: 2026-11-23
        by: claude-sonnet-5-5
        verdict: changed
        source: sep-philolaus
        note: 'Graded C scholarly: Section 7.2 says only that there is a possibility Plato met an aged Philolaus in Tarentum on his 388-7 visit to southern Italy and Sicily (D. L. III 36).'
      - on: 2026-11-23
        by: claude-opus-5-5
        verdict: confirmed
        note: Rouse Ball p. 36 says that Eudoxus, like Plato, went to Tarentum and studied under Archytas, but gives no date; SEP Philolaus §7.2 places Plato's first visit to southern Italy and Sicily in 388-7 but presents a meeting with Philolaus at Tarentum only as a possibility.
    sources:

  - id: plato.influenced-by.pythagoreans
    predicate: influenced-by
    object: pythagoreans
    confidence: B
    basis: scholarly
    origin: ai-extracted
    audits:
      - on: 2026-11-23
        by: claude-sonnet-5-5
        verdict: changed
        source: diogenes-laertius-lives-hicks
        note: 'Graded A primary: DL 3.8 says Plato mixed doctrines of Heraclitus, the Pythagoreans and Socrates, agreeing with Pythagoras on the intelligible.'
      - on: 2026-11-23
        by: claude-sonnet-5-5
        verdict: confirmed
        note: SEP 3.7 says Plato's evidence and Aristotle's cohere to suggest considerable Pythagorean influence on Plato's late theory of principles, while stressing that wider influence is limited and debated.
      - on: 2026-11-23
        by: claude-sonnet-5-5
        verdict: confirmed
        source: rouse-ball-short-account-history-mathematics
        note: Rouse Ball says that perhaps Plato's philosophy should be regarded as founded on Pythagorean rather than Socratic teaching, a hedged judgment.
